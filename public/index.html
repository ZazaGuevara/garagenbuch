<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garagenbuch</title>
<meta name="theme-color" content="#1C1C1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Garagenbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: Werkstatt-Kladde – sticky Kopf mit Jahresgewinn, Tabs, eine Spalte am Handy, zwei am Desktop */
:root{
  --bg:#F1F1F2; --surface:#FFFFFF; --sunk:#E6E6E8; --ink:#1C1C1F; --muted:#626268; --line:#D8D8DC;
  --accent:#C8202A; --accent-ink:#FFFFFF; --in:#1D7A3B; --out:#B3361F; --warn:#9A6A12; --plate:#FFFFFF; --plate-ink:#111;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1B1B1F; --sunk:#25252A; --ink:#EDEDF0; --muted:#9A9AA3; --line:#303036;
  --accent:#FF5A60; --accent-ink:#1A0506; --in:#5CC97E; --out:#F07B64; --warn:#E0B054; --plate:#F2F2F2; --plate-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1B1B1F; --sunk:#25252A; --ink:#EDEDF0; --muted:#9A9AA3; --line:#303036;
  --accent:#FF5A60; --accent-ink:#1A0506; --in:#5CC97E; --out:#F07B64; --warn:#E0B054; --plate:#F2F2F2; --plate-ink:#111; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.6rem}
h3{font-size:1.15rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Kopf */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em}
.brand span{font-size:.78rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headstat{margin-left:auto;text-align:right;line-height:1.1}
.headstat small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.headstat .num{font-size:1.35rem}
.yearsel{width:auto;flex:0 0 auto;font-size:.9rem;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:8px;padding:4px 8px}
.yearsel option{color:var(--ink);background:var(--surface)}
nav{background:var(--surface);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:20px 80px;display:flex;flex-direction:column;gap:20px}
.banner{background:var(--sunk);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;font-size:.9rem}

/* Bausteine */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi .num{font-size:1.45rem}
.kpi em{font-style:normal;font-size:.8rem;color:var(--muted)}
.pos{color:var(--in)} .neg{color:var(--out)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.total{border-top:2px solid var(--ink);border-bottom:0;font-weight:600;padding-top:10px;margin-top:4px}
.row span:first-child{min-width:0}
.num{white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.85rem}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}

/* Formular */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;border-radius:8px;padding:12px 6px;background:transparent;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"][data-v="ein"]{color:var(--in)}
.seg button[aria-pressed="true"][data-v="aus"]{color:var(--out)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:1rem;width:100%;min-width:0}
input.big{font-family:var(--f-mono);font-size:1.6rem;padding:12px 14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--out);color:#fff}
.btn.sm{padding:7px 12px;font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.preview{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.88rem;display:flex;gap:16px;flex-wrap:wrap}

/* Liste */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:.8rem;color:var(--muted);grid-column:1}
.item .a{grid-row:1/span 2;grid-column:2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .ops{display:flex;gap:6px}
.month{font-family:var(--f-display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:14px}
.plate{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.78rem;background:var(--plate);color:var(--plate-ink);border:1.5px solid #222;border-radius:4px;padding:1px 6px;white-space:nowrap}
.plate::before{content:"";width:8px;height:8px;background:#D52B1E;border-radius:1px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:20}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.8rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.brand{flex:1 1 auto}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){h2{font-size:1.4rem}.headstat .num{font-size:1.05rem}.brand b{font-size:1.2rem}header .wrap{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Ergänzungen: Beleg-Scan, Aufträge, Lager */
.scan{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px dashed var(--accent);border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.scan .btn{display:inline-flex;align-items:center;gap:8px}
.scan img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.scan p{margin:0;flex:1;min-width:180px}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.poslist{display:flex;flex-direction:column;gap:6px}
.posrow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.88rem}
.posrow .muted{grid-column:1/-1;font-size:.78rem}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)}
.check input{width:auto}
.sum{background:var(--sunk);border-radius:8px;padding:12px 14px}
.addrow{display:grid;grid-template-columns:2fr 70px 100px auto;gap:8px;align-items:end}
@media (max-width:560px){.addrow{grid-template-columns:1fr 1fr}.addrow label:first-child{grid-column:1/-1}}
.tbl{overflow-x:auto;margin-inline:-4px}
.tbl table{width:100%;border-collapse:collapse;min-width:760px;font-size:.92rem}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover,.tbl tbody tr:focus{background:var(--sunk);outline:none}
.rowbtn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;padding:12px 6px;border-radius:0}
.rowbtn:hover{background:var(--sunk)}
a.beleg{color:var(--accent);font-size:.8rem;font-weight:600}
.filebtn{position:relative;overflow:hidden;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;font-size:1rem;color:var(--accent-ink)}
.filebtn.ghost{color:var(--ink)}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

 {name:"PostFinance Autoversicherung",zeilen:["c/o TONI Digital Solutions AG","Seefeldstrasse 5a","8008 Zürich"]}];
const versListe=()=>Array.isArray(S.set.versicherer)&&S.set.versicherer.length? S.set.versicherer : VERSICHERER;
const COLL = {buchungen:"entries", fahrzeuge:"cars", teile:"parts", auftraege:"jobs"};

/* ---------- Zustand ---------- */
const S = {entries:[], cars:[], parts:[], jobs:[], set:{...DEF}, year:new Date().getFullYear(), tab:"home",
  form:{art:"aus", kat:"teile_e", mwst:8.1, edit:null, pos:[], toLager:false, photo:null, scan:"idle", scanMsg:""},
  auf:{typ:"re",lines:[]}, carEdit:null, partEdit:null, del:null, mode:"lade", canScan:false, canStore:false};
const cap = {sample:null, assets:null};

/* ---------- Speicher ---------- */
const store = {
  db:null, base:null, local:false,
  async init(){
    try{
      const db = await platform.use("db"); const user = await platform.use("user");
      if(db && user){ const id = await user.id(); if(id){ this.db=db; this.base=`data/users/${id}`; } }
    }catch(e){}
    this.initCaps();
    if(!this.db){ this.local=true; S.mode="lokal"; this.loadLocal(); render(); return; }
    S.mode="cloud";
    for(const c in COLL) this.db.collection(`${this.base}/store/${c}`).onSnapshot(s=>{S[COLL[c]]=s.docs.map(d=>({id:d.id,...d.data()})); render();}, err);
    this.db.doc(this.base+"/settings").onSnapshot(s=>{ if(s.exists) S.set=mergeSet(s.data()); render();}, err);
    render();
  },
  async initCaps(){
    try{ cap.sample = await platform.use("sample"); const lim = cap.sample ? await cap.sample.limits().catch(()=>null) : null; S.canScan = !!lim?.images; }catch(e){}
    try{ cap.assets = await platform.use("assets"); S.canStore = !!cap.assets; }catch(e){}
    render();
  },
  loadLocal(){ try{ const d=JSON.parse(localStorage.getItem("garagenbuch")||"{}"); for(const c in COLL) S[COLL[c]]=d[COLL[c]]||[]; S.set=mergeSet(d.set); }catch(e){} },
  saveLocal(){ try{ const d={set:S.set}; for(const c in COLL) d[COLL[c]]=S[COLL[c]]; localStorage.setItem("garagenbuch", JSON.stringify(d)); }catch(e){} },
  newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); },
  async put(coll, obj){
    const id = obj.id || this.newId(); const body={...obj}; delete body.id;
    for(const k in body) if(body[k]===undefined) delete body[k];
    if(this.local){ const arr=S[COLL[coll]]; const i=arr.findIndex(x=>x.id===id); if(i>=0) arr[i]={id,...body}; else arr.push({id,...body}); this.saveLocal(); render(); return id; }
    await this.db.doc(`${this.base}/store/${coll}/${id}`).set(body); return id;
  },
  async del(coll, id){
    if(this.local){ S[COLL[coll]]=S[COLL[coll]].filter(x=>x.id!==id); this.saveLocal(); render(); return; }
    await this.db.doc(`${this.base}/store/${coll}/${id}`).delete();
  },
  async saveSet(){ if(this.local){ this.saveLocal(); render(); return; } await this.db.doc(this.base+"/settings").set({...S.set}); }
};
function err(e){ toast("Fehler: "+(e?.message||e?.code||"unbekannt")); }

/* ---------- Rechnen ---------- */
const chf = (v,d=0)=> (v<0?"−":"")+"CHF "+Math.abs(v).toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d});
const chf2 = v=>chf(v,2);
const pct = v=> isFinite(v)? (v*100).toLocaleString("de-CH",{maximumFractionDigits:1})+" %" : "–";
const esc = s=> String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
const fmtD = s=> s? s.split("-").reverse().join(".") : "";
const r05 = v=> Math.round(v*20)/20;
const num = v=> parseFloat(String(v??"").replace(/'/g,"").replace(",","."))||0;
const NS = ()=> 1+0.081;

function netOf(e){
  const s=S.set, k=KMAP[e.kat]; const b=+e.betrag||0;
  if(!k || k.art==="privat" || !s.pflicht) return b;
  if(s.methode==="effektiv"){ if(e.margeEk!=null){ const m=Math.max(0,b-(+e.margeEk||0)); return b-m*(+e.mwst||0)/(100+(+e.mwst||0)); } return b/(1+(+e.mwst||0)/100); }
  if(k.art==="ein") return b*(1-(k.g===2? s.sss2 : s.sss1)/100);
  return b;
}
function calc(year){
  const s=S.set, Y=String(year), E=S.entries.filter(e=>(e.datum||"").startsWith(Y));
  const r={ein:0,aus:0,einB:0,mwstSchuld:0,vst:0,umsatzMwst:0,byKat:{},months:Array.from({length:12},()=>({ein:0,aus:0})),paid:{bezug:0,einlage:0,mwst_z:0,ahv_z:0,steuer_z:0},n:E.length,sem:[0,0],q:[0,0,0,0]};
  for(const e of E){
    const k=KMAP[e.kat]; if(!k) continue; const b=+e.betrag||0, n=netOf(e), m=+(e.datum.slice(5,7))-1;
    if(k.art==="privat"){ r.paid[k.id]+=b; continue; }
    r.byKat[k.id]=(r.byKat[k.id]||0)+n;
    if(k.art==="ein"){ r.ein+=n; r.einB+=b; r.months[m].ein+=n;
      if(s.pflicht){ if(s.methode==="saldo"){ r.mwstSchuld+=b-n; r.sem[m<6?0:1]+=b-n; } else { r.umsatzMwst+=b-n; r.q[Math.floor(m/3)]+=b-n; } } }
    else { r.aus+=n; r.months[m].aus+=n; if(s.pflicht&&s.methode==="effektiv"){ r.vst+=b-n; r.q[Math.floor(m/3)]-=b-n; } }
  }
  if(s.methode==="effektiv") r.mwstSchuld=r.umsatzMwst-r.vst;
  if(!s.pflicht) r.mwstSchuld=0;
  r.abschr=+s.abschr||0; r.gewinn=r.ein-r.aus-r.abschr;
  const base=Math.max(0,r.gewinn); let rate=0.10, ahv;
  if(base<10100) ahv=530; else { if(base<60500) rate=0.05371+(0.10-0.05371)*(base-10100)/(60500-10100); ahv=base*rate; }
  r.ahvRate=base<10100?null:rate; r.ahv=Math.round(ahv*(1+(+s.ahvVk||0)/100));
  r.steuer=Math.round(Math.max(0,r.gewinn-r.ahv)*(+s.steuer||0)/100);
  r.mwstOffen=r.mwstSchuld-r.paid.mwst_z; r.ahvOffen=r.ahv-r.paid.ahv_z; r.steuerOffen=r.steuer-r.paid.steuer_z;
  r.frei=r.gewinn-r.ahv-r.steuer;
  const K=id=>r.byKat[id]||0;
  r.werk={u:K("arbeit"), k:K("lohn")+K("sozial")+K("fremd")+K("oel")};
  r.teile={u:K("teile_v"), k:K("teile_e")};
  r.auto={u:K("auto_v")+K("neu_v"), k:K("auto_e")};
  r.gemein=r.aus-r.werk.k-r.teile.k-r.auto.k+r.abschr;
  const J=S.jobs.filter(j=>(j.datum||"").startsWith(Y)&&docTyp(j)==="re");
  r.jobs=J.length; r.jobArbeit=J.reduce((a,j)=>a+(+j.arbeit||0),0);
  r.jobTeileVk=J.reduce((a,j)=>a+docLines(j).filter(l=>l.typ==="teil").reduce((b,p)=>b+p.menge*p.vk,0),0);
  r.jobTeileEk=J.reduce((a,j)=>a+docLines(j).filter(l=>l.typ==="teil").reduce((b,p)=>b+p.menge*(+p.ek||0),0),0);
  r.lagerwert=S.parts.reduce((a,p)=>a+(+p.menge||0)*(+p.ek||0),0);
  const sold=S.cars.filter(c=>c.vk && (c.vkDatum||"").startsWith(Y));
  r.carsSold=sold.length; r.carsStock=S.cars.filter(c=>!c.vk).length;
  r.carMarge=sold.reduce((a,c)=>a+carMarge(c),0);
  r.carDays=sold.length? sold.reduce((a,c)=>a+days(c),0)/sold.length : 0;
  return r;
}
const carEinstand=c=>(+c.ek||0)+(+c.kosten||0);
const carMarge=c=>c.vk? (+c.vk)-carEinstand(c) : 0;
function days(c){ if(!c.ekDatum) return 0; const a=new Date(c.ekDatum), b=c.vkDatum? new Date(c.vkDatum): new Date(); return Math.max(0,Math.round((b-a)/864e5)); }
const vkVorschlag = ek => r05(ek*(1+(+S.set.aufschlag||0)/100));

/* ---------- Render ---------- */
const V=()=>document.getElementById("view");
function render(){
  document.getElementById("firmaName").textContent=S.set.firma||"Garage";
  const ys=new Set([new Date().getFullYear(), S.year]); S.entries.forEach(e=>e.datum&&ys.add(+e.datum.slice(0,4)));
  const sel=document.getElementById("yearSel"); sel.innerHTML=[...ys].sort((a,b)=>b-a).map(y=>`<option ${y===S.year?"selected":""}>${y}</option>`).join("");
  const r=calc(S.year);
  document.getElementById("hYear").textContent=S.year;
  document.getElementById("hGewinn").textContent=chf(r.gewinn);
  document.querySelectorAll("#tabs button").forEach(b=>{ b.setAttribute("aria-selected", b.dataset.tab===S.tab); b.hidden=(b.dataset.tab==="lager"&&!S.set.lager)||(b.dataset.tab==="autos"&&!S.set.autos); });
  if((S.tab==="lager"&&!S.set.lager)||(S.tab==="autos"&&!S.set.autos)) S.tab="home";
  const t={home,neu,kunden,ausw:auswertung,auftrag:(r)=>S.jobOpen?jobDetail(S.jobOpen):auftrag(r),qr:()=>`<div style="max-width:620px;width:100%;margin:0 auto">${qrPanel()}</div>`,lager,liste,autos,steuern,setup}[S.tab];
  V().innerHTML=(S.mode==="lokal"?`<div class="banner">Der Speicher auf diesem Gerät ist nicht verfügbar (privates Surfen?). Daten werden nicht dauerhaft gespeichert.</div>`:"")+(S.tab==="home"&&window.driveBox?driveBox():"")+t(r);
  bind();
}
/* Re-render, aber getippte Werte im Formular behalten */
function soft(fn,skip=[]){ const vals={}; V().querySelectorAll("input[id],select[id]").forEach(el=>{ if(el.type!=="checkbox") vals[el.id]=el.value; }); fn&&fn(); render(); for(const id in vals){ if(skip.includes(id)) continue; const el=document.getElementById(id); if(el) el.value=vals[id];} prev(); aufSum(); }

function home(r){
  const has=S.entries.length>0;
  const mx=Math.max(1,...r.months.map(m=>Math.max(m.ein,m.aus)));
  const W=640,H=220,P=36,bw=(W-P-8)/12, y=v=>H-24-(v/mx)*(H-44), ticks=[0,mx/2,mx];
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben pro Monat">
   ${ticks.map(t=>`<line x1="${P}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${Math.round(t/1000)}k</text>`).join("")}
   ${r.months.map((m,i)=>{const x=P+i*bw+4,w=(bw-10)/2;return `<rect x="${x}" y="${y(m.ein)}" width="${w}" height="${Math.max(0,H-24-y(m.ein))}" fill="var(--in)" rx="2"><title>${MON[i]}: Einnahmen ${chf(m.ein)}</title></rect><rect x="${x+w+2}" y="${y(m.aus)}" width="${w}" height="${Math.max(0,H-24-y(m.aus))}" fill="var(--out)" rx="2"><title>${MON[i]}: Ausgaben ${chf(m.aus)}</title></rect><text x="${x+w}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[i]}</text>`}).join("")}
  </svg>`;
  const ruecklage=Math.max(0,r.mwstOffen)+Math.max(0,r.ahvOffen)+Math.max(0,r.steuerOffen);
  const tm=r.jobTeileVk-r.jobTeileEk;
  return `
  ${!has?`<div class="panel empty"><h2>Noch keine Buchungen in ${S.year}</h2><p>Fotografiere deinen ersten Beleg oder erstelle einen Kundenauftrag. Gewinn, Marge, MWST und Steuer-Rückstellung rechnen sich automatisch.</p>
    <div class="actions"><button class="btn" data-go="neu">Beleg erfassen</button><button class="btn ghost" data-go="auftrag">Auftrag erstellen</button><button class="btn ghost" data-act="demo">Beispieldaten laden</button></div></div>`:""}
  <div class="actions"><button class="btn" data-go="neu">+ Beleg</button><button class="btn ghost" data-go="auftrag">Rechnung / KV</button><button class="btn ghost" data-go="ausw">Auswertung</button><button class="btn ghost" data-go="kunden">Kunden</button><button class="btn ghost" data-go="qr">Zahlungs-QR</button></div>
  <div class="kpis">
    <div class="kpi"><small>Einnahmen netto</small><span class="num pos">${chf(r.ein)}</span><em>${r.n} Buchungen · ${r.jobs} Aufträge</em></div>
    <div class="kpi"><small>Ausgaben netto</small><span class="num neg">${chf(r.aus+r.abschr)}</span><em>inkl. Abschreibungen</em></div>
    <div class="kpi"><small>Gewinn</small><span class="num ${r.gewinn>=0?"pos":"neg"}">${chf(r.gewinn)}</span><em>Reingewinn nach Rücklagen ca. ${chf(r.frei)}</em></div>
    <div class="kpi"><small>Zurücklegen</small><span class="num" style="color:var(--warn)">${chf(ruecklage)}</span><em>${S.set.pflicht?"MWST + AHV + Steuern offen":"AHV + Steuern offen"}</em></div>
  </div>
  ${backupBanner()}
  ${homeExtras()}
  <div class="panel"><div class="actions" style="justify-content:space-between"><h3>Monatsverlauf ${S.year}</h3><div class="legend"><span><i style="background:var(--in)"></i>Einnahmen</span><span><i style="background:var(--out)"></i>Ausgaben</span></div></div><div class="chart">${svg}</div></div>
  <div class="grid2">
    <div class="panel"><h3>Teile & Material: bezahlt → verrechnet</h3><div class="rows">
      <div class="row"><span>Den Kunden verrechnet</span><span class="num">${chf(r.jobTeileVk)}</span></div>
      <div class="row"><span>Selbst bezahlt (Einkauf)</span><span class="num">${chf(-r.jobTeileEk)}</span></div>
      <div class="row total"><span>Marge auf Teilen</span><span class="num ${tm>=0?"pos":"neg"}">${chf(tm)}</span></div>
      <div class="row small"><span class="muted">Marge % · Aufschlag</span><span class="num">${pct(r.jobTeileVk?tm/r.jobTeileVk:NaN)} · ${r.jobTeileEk?"×"+(r.jobTeileVk/r.jobTeileEk).toFixed(2):"–"}</span></div>
      ${S.set.lager?`<div class="row small"><span class="muted">Noch an Lager (Einkaufswert)</span><span class="num">${chf(r.lagerwert)}</span></div>`:""}</div></div>
    <div class="panel"><h3>Margen pro Bereich (Buchhaltung)</h3>${marge("Werkstatt (Arbeit − Löhne, Fremdarbeit, Öl)",r.werk)}${marge("Ersatzteile & Pneus (Verkauf − Einkauf)",r.teile,true)}${S.set.autos?marge("Fahrzeughandel",r.auto):""}
      <div class="row small"><span class="muted">Fixkosten (Miete, Versicherung, Büro …)</span><span class="num">${chf(r.gemein)}</span></div></div>
    <div class="panel"><h3>Was bleibt dir?</h3><div class="rows">
      <div class="row"><span>Gewinn</span><span class="num">${chf(r.gewinn)}</span></div>
      <div class="row"><span>− AHV/IV/EO (Schätzung)</span><span class="num">${chf(-r.ahv)}</span></div>
      <div class="row"><span>− Steuern (${S.set.steuer} %, Schätzung)</span><span class="num">${chf(-r.steuer)}</span></div>
      <div class="row total"><span>Frei verfügbar</span><span class="num ${r.frei>=0?"pos":"neg"}">${chf(r.frei)}</span></div>
      <div class="row small"><span class="muted">Pro Monat</span><span class="num">${chf(r.frei/12)}</span></div>
      <div class="row small"><span class="muted">Bisher privat bezogen</span><span class="num">${chf(r.paid.bezug)}</span></div></div></div>
  </div>
  ${[S.entries,S.cars,S.parts,S.jobs].some(a=>a.some(e=>e.demo))?`<div class="actions"><button class="btn ghost sm" data-act="demo-del">Beispieldaten entfernen</button></div>`:""}`;
}
function marge(l,x,faktor){
  const db=x.u-x.k, p=x.u? db/x.u : NaN; const w=Math.max(0,Math.min(100,(p||0)*100));
  return `<div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="border:0;padding:0"><span>${l}</span><span class="num ${db>=0?"pos":"neg"}">${chf(db)}</span></div>
  <div class="bar"><span style="width:${w}%"></span></div><div class="small muted">Umsatz ${chf(x.u)} · Kosten ${chf(x.k)} · Marge ${pct(p)}${faktor&&x.k?` · Aufschlag ×${(x.u/x.k).toFixed(2)}`:""}</div></div>`;
}

/* ---------- Beleg erfassen (mit Foto) ---------- */
function neu(){
  const f=S.form, list=KAT[f.art].filter(k=>S.set.autos||!["auto_v","neu_v","auto_e"].includes(k.id)), e=f.edit? S.entries.find(x=>x.id===f.edit):null;
  const k=KMAP[f.kat]||list[0];
  const pick = `<label class="btn filebtn">${f.photo?"Neues Foto":"Foto aufnehmen"}<input type="file" class="fileIn" accept="image/*" capture="environment" aria-label="Beleg mit der Kamera fotografieren"></label>
      <label class="btn ghost filebtn">Foto oder PDF wählen<input type="file" class="fileIn" accept="image/*,application/pdf,.pdf" aria-label="Belegfoto oder PDF wählen"></label>`;
  const scanBox = `<div class="scan">
      ${f.photo?`<img src="${f.photo.url}" alt="Belegfoto">`:""}

          f.scan==="done"?`<b>Beleg gelesen.</b> Bitte kurz prüfen und speichern.${f.scanMsg?` <span class="muted">${esc(f.scanMsg)}</span>`:""}`:
          f.scan==="attached"?`<b>Foto angehängt.</b> <span class="muted">${esc(f.scanMsg)}</span>`:
          f.scan==="error"?`<span class="neg">${esc(f.scanMsg)}</span>`:
          `<b>Beleg fotografieren</b><br><span class="small muted">${S.canScan?"Foto oder PDF einer Quittung/Rechnung – Betrag, Datum, Lieferant und Positionen werden automatisch ausgefüllt.":"Das Foto wird als Beleg gespeichert. Automatisches Auslesen ist noch nicht eingerichtet – Betrag bitte unten eintragen."}</span>`}</p>
      <div class="actions">${f.scan==="busy"?`<button class="btn ghost sm" type="button" data-act="scan-stop">Abbrechen</button>`:pick}</div>
    </div>`;
  const posHtml = f.pos.length? `<div class="poslist"><span class="small muted"><b>${f.pos.length} Positionen erkannt</b> (Preise exkl. MWST)</span>
     ${f.pos.map((p,i)=>`<div class="posrow"><span>${esc(p.name)}${p.artnr?` <span class="muted">· ${esc(p.artnr)}</span>`:""}</span><span class="num">${p.menge} × ${chf2(p.ek)}</span><button type="button" class="btn ghost sm" data-prm="${i}" aria-label="Position entfernen">✕</button>
       <span class="muted">Verkaufspreis-Vorschlag: ${chf2(vkVorschlag(p.ek))} (+${S.set.aufschlag} %)</span></div>`).join("")}

  return `<div class="panel" style="max-width:720px">
   <h2>${e?"Buchung bearbeiten":"Beleg erfassen"}</h2>

   <div class="chips" role="group" aria-label="Kategorie">${list.map(c=>`<button type="button" data-kat="${c.id}" aria-pressed="${k.id===c.id}">${c.l}</button>`).join("")}</div>
   <form id="fBuch" class="fields" style="grid-template-columns:1fr" autocomplete="off">
    <label>Betrag inkl. MWST (CHF)<input class="big" id="fBetrag" inputmode="decimal" placeholder="0.00" value="${e?e.betrag:""}" required></label>
    <div class="fields">
     <label>Datum<input type="date" id="fDatum" value="${e?e.datum:today()}" required></label>
     <label ${S.set.pflicht?"":"hidden"}>MWST-Satz<select id="fMwst">${[8.1,2.6,0].map(m=>`<option value="${m}" ${(+f.mwst)===m?"selected":""}>${m===0?"ohne MWST":m+" %"}</option>`).join("")}</select></label>
     <label>Beleg-Nr.<input id="fBeleg" placeholder="z.B. R-104" value="${esc(e?.beleg)}"></label>

    <label>${f.art==="ein"?"Kunde / Text":"Lieferant / Text"}<input id="fText" placeholder="${f.art==="ein"?"Kunde, Fahrzeug, Arbeit":"Lieferant, Zweck"}" value="${esc(e?.text)}"></label>

    ${posHtml}

function toJpeg(src,w,h){
  const sc=Math.min(1,1800/Math.max(w,h)); const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",0.85));
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); return await toJpeg(bmp,bmp.width,bmp.height); }catch(e){}
  try{ const url=URL.createObjectURL(file); const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
       const b=await toJpeg(img,img.naturalWidth,img.naturalHeight); URL.revokeObjectURL(url); return b; }catch(e){}
  if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file;
  throw {code:"format"};
}
async function onPhoto(file){

      if(f.photo?.url&&f.photo.url.startsWith("blob:")) URL.revokeObjectURL(f.photo.url);
      f.photo={blob:file,url:thumb,pdf:true};

      if(!S.canScan&&!(hasText&&cap.sample)){ f.scan="attached"; f.scanMsg="PDF angehängt. Bitte Betrag, Datum und Text eintragen."; soft(); return; }
      const images= hasText? [] : await Promise.all(r.imgs.slice(0,3).map(canvasJpeg));
      scanFile({text:hasText?r.text:"", images});
    }catch(e){ f.scan="error"; f.scanMsg="PDF konnte nicht geöffnet werden ("+(e?.message||e)+")."; soft(); }
    return;
  }
  let blob; try{ blob=await shrink(file); }catch(e){
    f.scan="error"; f.scanMsg="Dieses Bildformat kann nicht gelesen werden (oft HEIC vom iPhone). Lösung: Einstellungen › Kamera › Formate › «Maximale Kompatibilität», oder einen Screenshot des Belegs hochladen."; render(); return; }
  if(f.photo?.url) URL.revokeObjectURL(f.photo.url);

  if(S.canScan) scanFile({images:[blob]}); else { f.scan="attached"; f.scanMsg="Bitte Betrag, Datum und Text eintragen und speichern."; soft(); }

async function scanFile(src){

Entscheide: Ist es eine AUSGABE der Garage (Einkauf, Lieferantenrechnung, Quittung) → art "aus", oder eine Rechnung DER Garage an einen Kunden → art "ein".
Wähle die passende Kategorie-ID aus: ${ids}.
Antworte NUR mit JSON in genau dieser Form:
{"art":"aus","kategorie":"teile_e","datum":"2026-03-14","total":245.60,"mwst":8.1,"partner":"Name des Lieferanten oder Kunden","beleg":"Rechnungs-Nr.","positionen":[{"bezeichnung":"Bremsbeläge VA VW Golf","artikelnr":"0986494","menge":2,"einzelpreis_netto":42.50}]}
Regeln: total = Endbetrag (inkl. allfälliger MWST) in CHF (Zahl). mwst = hauptsächlicher MWST-Satz auf dem Beleg: 8.1, 2.6 oder 0. datum im Format JJJJ-MM-TT. positionen nur für Ersatzteile, Pneus, Öl oder Material; einzelpreis_netto = Preis pro Stück OHNE MWST nach Rabatt (wenn nur inkl. MWST angegeben: durch 1.081 teilen). Fehlende Angaben als null. Keine Erklärung.`;
  scanCtl=new AbortController();
  try{
    const d=await cap.sample.json(prompt+(src.text?`\n\nText des Belegs (aus PDF):\n${src.text.slice(0,40000)}`:""),{...(src.images?.length?{images:src.images}:{}),signal:scanCtl.signal});
    const kat=KMAP[d?.kategorie]? d.kategorie : (d?.art==="ein"?"arbeit":"teile_e");
    f.art=KMAP[kat].art; f.kat=kat; f.mwst=[8.1,2.6,0].includes(+d?.mwst)? +d.mwst : KMAP[kat].m;
    f.pos=(Array.isArray(d?.positionen)?d.positionen:[]).filter(p=>p&&p.bezeichnung).map(p=>({name:String(p.bezeichnung),artnr:p.artikelnr?String(p.artikelnr):"",menge:Math.max(1,num(p.menge)||1),ek:Math.round(num(p.einzelpreis_netto)*100)/100}));
    f.toLager=S.set.lager&&kat==="teile_e"; f.scan="done";

    render();

    if(num(d?.total)) set("fBetrag", num(d.total).toFixed(2));

  }catch(e){

    f.scanMsg = e?.code==="not_granted" ? "Du hast Claude den Zugriff nicht erlaubt. Erfasse den Beleg von Hand oder versuche es nach dem Neuladen nochmals." :
                e?.code==="invalid_json" ? "Beleg nicht lesbar. Bitte schärfer und ganz im Bild fotografieren, oder von Hand erfassen." :
                e?.code==="rate_limited" ? "Gerade zu viele Anfragen. Bitte in einer Minute nochmals." :
                "Beleg konnte nicht automatisch gelesen werden ("+(e?.code||"Fehler")+"). Das Foto bleibt angehängt – bitte Betrag von Hand eintragen.";
    soft();
  }

const PDFJS="vendor/";
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Bibliothek konnte nicht geladen werden")); document.head.appendChild(s); }); }
async function pdfLib(){ if(!window.pdfjsLib){ await loadScript(PDFJS+"pdf.worker.min.js"); await loadScript(PDFJS+"pdf.min.js"); } return window.pdfjsLib; }
async function readPdf(file){
  const lib=await pdfLib(); const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let text=""; const imgs=[];
  for(let i=1;i<=Math.min(pdf.numPages,8);i++){
    const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); const rows=new Map();
    for(const it of tc.items){ if(!it.str||!it.str.trim()) continue; const y=Math.round(it.transform[5]/2)*2; if(!rows.has(y)) rows.set(y,[]); rows.get(y).push([it.transform[4],it.str]); }
    text+=`\n--- Seite ${i} ---\n`+[...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,r])=>r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join("   ")).join("\n");
    if(i<=4){ const vp=pg.getViewport({scale:1.8}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; imgs.push(c); }
  }
  return {text, imgs};
}

function versCalc(){

const custKey=j=> (j.vers&&!j.sbFor? (j.vers.halter?.name||j.kunde) : j.kunde)||"Ohne Namen";
function jobDue(j){ const d=new Date(j.datum); d.setDate(d.getDate()+(+S.set.zahlfrist||10)); return d; }
function jobOverdue(j){ return isRE(j)&&j.status!=="bezahlt"&&new Date()>jobDue(j); }
function overdueDays(j){ return Math.max(0,Math.floor((new Date()-jobDue(j))/864e5)); }
function jobProfit(j){
  const L=docLines(j);
  const ein=S.entries.filter(e=>e.auftrag===j.id&&KMAP[e.kat]?.art==="ein");
  const umsatz=ein.reduce((s,e)=>s+netOf(e),0);
  const teileEk=L.filter(l=>l.typ==="teil").reduce((s,l)=>s+realEk((+l.ek||0)*l.menge),0);
  const kosten=S.entries.filter(e=>e.kostenFuer===j.id);
  const zugeordnet=kosten.reduce((s,e)=>s+netOf(e),0);
  let std=L.filter(l=>l.typ==="arbeit").reduce((s,l)=>s+l.menge,0);
  if(j.vers?.gruppen) std=j.vers.gruppen.filter(g=>g.art==="arbeit"||g.art==="lack").reduce((s,g)=>s+g.zeilen.filter(z=>/std/i.test(z.einheit||"")).reduce((a,z)=>a+(+z.menge||0),0),0);
  const db=umsatz-teileEk-zugeordnet;
  return {umsatz:r2(umsatz),teileEk:r2(teileEk),zugeordnet:r2(zugeordnet),kostenListe:kosten,db:r2(db),dbp:umsatz?db/umsatz:NaN,std,dbStd:std?db/std:NaN,ohneKosten:!teileEk&&!zugeordnet&&!!j.vers};
}
function kundenListe(){
  const M=new Map();
  for(const j of S.jobs){
    if(!isRE(j)) continue;
    const key=j.sbFor? j.kunde : custKey(j);
    if(!M.has(key)) M.set(key,{name:key,jobs:[],umsatz:0,kosten:0,db:0,std:0,offen:0,last:"",schilder:new Set(),adr:null,vers:0});
    const k=M.get(key);
    if(!j.sbFor){ const p=jobProfit(j); k.jobs.push(j); k.umsatz+=p.umsatz; k.kosten+=p.teileEk+p.zugeordnet; k.db+=p.db; k.std+=p.std; if(j.vers) k.vers++; }
    if(j.status!=="bezahlt") k.offen+=(+j.total||0);
    if((j.datum||"")>k.last) k.last=j.datum||"";
    if(j.schild) k.schilder.add(j.schild);
    if(!j.vers&&!k.adr&&(j.strasse||j.ort)) k.adr=[j.strasse,j.ort].filter(Boolean).join(", ");
    if(j.vers&&!j.sbFor&&!k.adr&&j.vers.halter) k.adr=[j.vers.halter.strasse,j.vers.halter.ort].filter(Boolean).join(", ");
  }
  return [...M.values()];
}

/* ---------- Auswertung: pro Auftrag bis zum Reingewinn ---------- */
const DIREKT=["teile_e","fremd","oel","auto_e","verbrauch"];
function ruecklageSatz(r){
  // Anteil vom Gewinn für AHV + Steuern (aus der Jahresschätzung, sonst Faustregel)
  if(r.gewinn>1000) return Math.min(0.5,Math.max(0,(r.ahv+r.steuer)/r.gewinn));
  return Math.min(0.5,0.10*(1+(+S.set.ahvVk||0)/100)+(+S.set.steuer||0)/100*0.9);
}
function periode(){ return S.aper||String(S.year); } // "2026" oder "2026-03"
function perLabel(p){ return p.length===4? `Jahr ${p}` : `${MON[+p.slice(5,7)-1]} ${p.slice(0,4)}`; }
function auswertung(){
  const P=periode(), r=calc(S.year), satz=ruecklageSatz(r), s=S.set;
  const E=S.entries.filter(e=>(e.datum||"").startsWith(P));
  let ein=0, direkt=0, fix=0, byFix={}, bezug=0, einOffen=0, verbrauchU=0;
  for(const e of E){ const k=KMAP[e.kat]; if(!k) continue; const n=netOf(e);
    if(k.art==="ein") ein+=n;
    else if(k.art==="aus"){ if(e.kat==="verbrauch"&&!e.kostenFuer) verbrauchU+=n; if(DIREKT.includes(e.kat)) direkt+=n; else { fix+=n; byFix[k.l]=(byFix[k.l]||0)+n; } }
    else if(k.id==="bezug") bezug+=+e.betrag||0; }
  const abschr=(+s.abschr||0)*(P.length===4?1:1/12);
  const brutto=ein-direkt, gewinn=brutto-fix-abschr, rueck=Math.max(0,gewinn)*satz, mw=s.pflicht? Math.max(0,r.mwstOffen)*(P.length===4?1:0) : 0;
  const rein=gewinn-rueck;
  // Aufträge im Zeitraum
  const J=S.jobs.filter(j=>isRE(j)&&!j.sbFor&&(j.datum||"").startsWith(P)).map(j=>({j,p:jobProfit(j)}));
  const totStd=J.reduce((a,x)=>a+x.p.std,0), totU=J.reduce((a,x)=>a+x.p.umsatz,0);
  const fixGesamt=fix+abschr+verbrauchU; // Gemeinkosten: Fixkosten + nicht zugeordnetes Verbrauchsmaterial
  for(const x of J){

function backupBanner(){ if(window.driveFresh&&driveFresh()) return ""; const l=S.set.lastBackup; const days=l? Math.floor((new Date()-new Date(l))/864e5) : 999; if(days<30||!S.entries.length) return "";
  return `<div class="banner" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span><b>${l?`Letzte Sicherung vor ${days} Tagen.`:"Noch keine Sicherung gemacht."}</b> Lade eine Komplett-Sicherung herunter (Daten, Belege, Rechnungen) und speichere sie bei dir.</span><button class="btn sm" data-act="backup">Jetzt sichern</button></div>`; }
const belegPfad=e=>`belege/${(e.datum||"").slice(0,4)}/${e.datum}_${(e.text||KMAP[e.kat]?.l||"Beleg").replace(/[^\wäöüÄÖÜ .-]/g,"").slice(0,40)}_${(+e.betrag).toFixed(2)}_${e.id.slice(-4)}`;
async function restoreZipOrJson(file){
  if(/\.zip$/i.test(file.name)){ try{ if(!window.JSZip) await loadScript("vendor/jszip.min.js"); const z=await JSZip.loadAsync(file); const f=z.file("garagenbuch-daten.json"); if(!f) throw 0; return restoreFile(new File([await f.async("string")],"x.json"),z); }catch(e){ toast("Das ist keine gültige Garagenbuch-Sicherung"); return; } }
  return restoreFile(file);
}
async function restoreFile(file,zip){
  try{ const d=JSON.parse(await file.text()); if(d.app!=="Garagenbuch"||!Array.isArray(d.entries)) throw 0; S.restore={...d,jobs:d.jobs||[],parts:d.parts||[],cars:d.cars||[],zip:zip||null,
      belege:zip? d.entries.filter(e=>e.belegAsset&&["pdf","jpg","png"].some(x=>zip.file(`${belegPfad(e)}.${x}`))).length : 0}; render(); }
  catch(e){ toast("Das ist keine gültige Garagenbuch-Sicherung"); }
}
async function restoreGo(){
  const d=S.restore; S.restore=null; let n=0, nb=0;
  const st=()=>document.getElementById("bkStatus");
  try{
    if(d.zip){ const B=d.entries.filter(e=>e.belegAsset); const MT={pdf:"application/pdf",jpg:"image/jpeg",png:"image/png"};
      for(const [i,e] of B.entries()){ if(st()) st().textContent=`Belege ${i+1}/${B.length} …`;
        for(const x of ["pdf","jpg","png"]){ const f=d.zip.file(`${belegPfad(e)}.${x}`); if(!f) continue;
          const ab=await f.async("arraybuffer"); await platform.putBlobWithId(e.belegAsset,new Blob([ab],{type:MT[x]})); nb++; break; } } }
    for(const e of d.entries){ await store.put("buchungen",e); n++; } for(const j of d.jobs){ await store.put("auftraege",j); n++; }
    for(const p of d.parts){ await store.put("teile",p); } for(const c of d.cars){ await store.put("fahrzeuge",c); }
    if(d.set){ S.set=mergeSet({...S.set,...d.set,logo:S.set.logo,logoW:S.set.logoW,logoH:S.set.logoH}); await store.saveSet(); }
    toast(`${n} Einträge${d.zip?` und ${nb} Belege`:""} wiederhergestellt`); render(); }catch(e){ err(e); }
}

/* ---------- Buchungen ---------- */
function liste(){
  const E=S.entries.filter(e=>(e.datum||"").startsWith(String(S.year))).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  const q=(S.q||"").toLowerCase();
  const F=q? E.filter(e=>[e.text,e.beleg,KMAP[e.kat]?.l,e.betrag].join(" ").toLowerCase().includes(q)):E;
  let html=`<div class="panel"><div class="actions" style="justify-content:space-between"><h2>Buchungen ${S.year}</h2><div class="actions"><button class="btn ghost sm" data-act="csv">Als CSV exportieren</button><button class="btn sm" data-go="neu">+ Beleg</button></div></div>
   <input id="fQ" placeholder="Suchen (Text, Beleg, Kategorie, Betrag)" value="${esc(S.q||"")}"><div id="csvOut"></div><div class="list">`;
  if(!F.length) html+=`<div class="empty"><p>${q?"Keine Treffer.":"Noch keine Buchungen in diesem Jahr."}</p></div>`;
  let lastM=null;
  for(const e of F){
    const m=+e.datum.slice(5,7)-1; if(m!==lastM){ html+=`<div class="month">${MON[m]} ${S.year}</div>`; lastM=m; }
    const k=KMAP[e.kat]||{l:"?",art:"aus"}; const sign=k.art==="ein"?"pos":k.art==="aus"?"neg":"muted"; const conf=S.del===e.id;
    html+=`<div class="item"><span class="t">${esc(e.text||k.l)}${e.demo?` <span class="pill warn">Beispiel</span>`:""}${e.auftrag?` <span class="pill">Auftrag</span>`:""}</span>
     <span class="m">${fmtD(e.datum)} · ${k.l}${e.beleg?" · "+esc(e.beleg):""}${+e.mwst?` · ${e.mwst} %`:""}${e.belegAsset?` · <a class="beleg" href="#" data-blob="${esc(e.belegAsset)}">Beleg öffnen</a>`:""}</span>
     <span class="a"><span class="num ${sign}">${k.art==="aus"?"−":k.art==="ein"?"+":""}${chf2(+e.betrag)}</span>
     <span class="ops">${conf?`<button class="btn danger sm" data-del="${e.id}">Löschen bestätigen</button><button class="btn ghost sm" data-act="nodel">Nein</button>`:`${e.auftrag?"":`<button class="btn ghost sm" data-edit="${e.id}">Bearbeiten</button>`}<button class="btn ghost sm" data-ask="${e.id}" aria-label="Löschen">✕</button>`}</span></span></div>`;
  }
  return html+`</div></div>`;
}

async function saveCar(ev){
  ev.preventDefault(); const g=id=>document.getElementById(id).value;
  const old=S.cars.find(x=>x.id===S.carEdit)||{};
  const obj={...old,id:S.carEdit||undefined,privat:!!document.getElementById("cPriv")?.checked,name:g("cName").trim(),schild:g("cSchild").trim(),ekDatum:g("cEkD"),ek:num(g("cEk")),kosten:num(g("cKost")),vkDatum:g("cVkD"),vk:g("cVk")?num(g("cVk")):null};
  const book = S.carEdit ? !!old.gebucht : !!document.getElementById("cBook")?.checked;
  try{
    if(book){
      obj.gebucht=true; const t=`${obj.name}${obj.schild?" ("+obj.schild+")":""}`;
      if(!old.bEk && obj.ek>0) obj.bEk=await store.put("buchungen",{datum:obj.ekDatum||today(),kat:"auto_e",betrag:obj.ek,mwst:0,text:"Ankauf "+t});
      if(!old.bVk && obj.vk>0) obj.bVk=await store.put("buchungen",{datum:obj.vkDatum||today(),kat:"auto_v",betrag:obj.vk,mwst:8.1,text:"Verkauf "+t,...(obj.privat!==false?{margeEk:obj.ek}:{})});
    }
    await store.put("fahrzeuge",obj); S.carEdit=null; toast(book?"Fahrzeug gespeichert und gebucht":"Fahrzeug gespeichert"); render();
  }catch(e){err(e);}
}

/* ---------- MWST & Steuern ---------- */
function mwstGrenze(r){
  const m=Math.max(1,...S.entries.filter(e=>(e.datum||"").startsWith(String(S.year))).map(e=>+e.datum.slice(5,7)));
  const proj= S.year===new Date().getFullYear()? r.einB/m*12 : r.einB, pc=Math.min(100,r.einB/1000), pp=Math.min(100,proj/1000);
  const st= r.einB>=100000?["bad","Grenze überschritten"] : proj>=100000?["bad","Hochrechnung über 100'000"] : proj>=80000?["warn","nahe an der Grenze"] : ["ok","deutlich darunter"];
  return `<p><span class="pill ${st[0]}">${st[1]}</span></p>
   <div class="rows"><div class="row"><span>Umsatz ${S.year} bisher</span><span class="num">${chf(r.einB)}</span></div>
   <div class="row"><span>Hochrechnung aufs Jahr</span><span class="num">${chf(proj)}</span></div></div>
   <div class="bar" style="position:relative"><span style="width:${pc}%"></span></div><div class="small muted">0 ··· CHF 100'000 (MWST-Grenze)</div>
   <p class="small muted">Du bist nicht MWST-pflichtig, solange dein Umsatz unter CHF 100'000 im Jahr liegt. Deine Rechnungen enthalten deshalb <b>keine MWST</b> – ausgewiesene MWST würdest du der ESTV schulden. Überschreitest du die Grenze, musst du dich innert 30 Tagen selbst bei der ESTV anmelden; dann unter Einstellungen «MWST-pflichtig: Ja» wählen.</p>`;
}
function steuern(r){
  const s=S.set;
  const per = s.methode==="saldo"
    ? `<div class="row"><span>1. Semester (Abgabe bis ${fmtD(S.year+"-08-29")})</span><span class="num">${chf2(r.sem[0])}</span></div><div class="row"><span>2. Semester (Abgabe bis ${fmtD((S.year+1)+"-03-01")})</span><span class="num">${chf2(r.sem[1])}</span></div>`
    : r.q.map((v,i)=>`<div class="row"><span>Q${i+1}</span><span class="num">${chf2(v)}</span></div>`).join("");
  return `<div class="grid2">
  <div class="panel"><h3>Mehrwertsteuer ${S.year}</h3>
   ${!s.pflicht?mwstGrenze(r):
   `<p class="small muted">${s.methode==="saldo"?`Saldomethode: Werkstatt ${s.sss1} %, Fahrzeughandel ${s.sss2} % vom Bruttoumsatz. Deinen Kunden verrechnest du trotzdem 8,1 %.`:"Effektive Methode: MWST auf Einnahmen minus Vorsteuer auf Ausgaben, quartalsweise."}</p>
   <div class="rows">${per}
    <div class="row total"><span>MWST-Schuld Jahr</span><span class="num">${chf2(r.mwstSchuld)}</span></div>
    <div class="row"><span>Bereits bezahlt</span><span class="num">${chf2(r.paid.mwst_z)}</span></div>
    <div class="row total"><span>Noch offen</span><span class="num" style="color:var(--warn)">${chf2(r.mwstOffen)}</span></div></div>`}
  </div>
  <div class="panel"><h3>AHV & Steuern (Schätzung)</h3><div class="rows">
    <div class="row"><span>Gewinn</span><span class="num">${chf(r.gewinn)}</span></div>
    <div class="row"><span>AHV/IV/EO ${r.ahvRate?pct(r.ahvRate):"Mindestbeitrag"} + ${s.ahvVk} % Verwaltung</span><span class="num">${chf(r.ahv)}</span></div>
    <div class="row"><span>davon bezahlt</span><span class="num">${chf(r.paid.ahv_z)}</span></div>
    <div class="row"><span>Steuern Kanton, Gemeinde, Bund (${s.steuer} %)</span><span class="num">${chf(r.steuer)}</span></div>
    <div class="row"><span>davon bezahlt</span><span class="num">${chf(r.paid.steuer_z)}</span></div>
    <div class="row total"><span>Rückstellung pro Monat</span><span class="num" style="color:var(--warn)">${chf((r.ahv+r.steuer)/12)}</span></div></div>
   <p class="small muted">AHV 2026 für Selbständige: 10 % ab CHF 60'500 Gewinn, darunter sinkende Skala (hier angenähert), Minimum CHF 530. Den Steuer-% stellst du unter Einstellungen ein – am besten mit dem Steuerrechner des Kantons Solothurn für deinen Gewinn ermitteln (Dornach 2026: Gemeinde 92 %, Kanton 104 %).</p></div>
  <div class="panel"><h3>Termine</h3><div class="rows">
   ${(!s.pflicht?[]:s.methode==="saldo"?[[S.year+"-08-29","MWST 1. Semester einreichen & zahlen"],[(S.year+1)+"-03-01","MWST 2. Semester einreichen & zahlen"]]:[[S.year+"-05-30","MWST Q1"],[S.year+"-08-29","MWST Q2"],[S.year+"-11-29","MWST Q3"],[(S.year+1)+"-03-01","MWST Q4"]]).concat([[S.year+"-12-31","Säule 3a einzahlen · Inventur Lager & Autos"],[(S.year+1)+"-01-30","AHV-Lohnbescheinigung Mitarbeitende"],[(S.year+1)+"-01-31","Lohnausweise abgeben"]]).map(([d,t])=>{const dd=Math.round((new Date(d)-new Date())/864e5);return `<div class="row"><span>${t}</span><span class="small ${dd<0?"muted":dd<=30?"neg":""}">${fmtD(d)}${dd>=0&&dd<=30?` · in ${dd} Tagen`:""}</span></div>`}).join("")}
  </div><p class="small muted">Belege 10 Jahre aufbewahren – fotografierte Belege bleiben im Garagenbuch gespeichert.</p></div></div>
  <div class="grid2">${abschlussPanel(r)}</div>`;
}

  if(S.set.autos){ const e1=await store.put("buchungen",{datum:d(2,10),kat:"auto_e",betrag:12000,mwst:0,text:"Ankauf VW Golf 1.4 TSI (SO 123456)",demo:true});

  await store.put("fahrzeuge",{name:"Škoda Octavia Combi, 2018",schild:"SO 98765",ekDatum:d(5,4),ek:9800,kosten:600,vkDatum:"",vk:null,demo:true}); }
  toast("Beispieldaten geladen");
}
async function csv(){
  const E=S.entries.filter(e=>(e.datum||"").startsWith(String(S.year))).sort((a,b)=>a.datum.localeCompare(b.datum));
  const lines=[["Datum","Beleg","Art","Kategorie","Text","Betrag brutto","MWST %","Netto"].join(";")].concat(E.map(e=>{const k=KMAP[e.kat]||{};return [fmtD(e.datum),e.beleg||"",k.art,k.l,(e.text||"").replace(/;/g,","),(+e.betrag).toFixed(2),e.mwst,netOf(e).toFixed(2)].join(";");}));
  const data="﻿"+lines.join("\n");
  try{ const dl=await platform.use("downloads"); if(dl){ await dl.save({filename:`garagenbuch-${S.year}.csv`,data}); return; } }catch(e){ if(e?.code==="declined") return; }
  document.getElementById("csvOut").innerHTML=`<p class="small muted">Kopieren und in Excel einfügen:</p><textarea readonly>${esc(data)}</textarea>`;
}
let tT; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2600);}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;S.del=null;S.jobOpen=null;S.kundeOpen=null;render();scrollTo(0,0);});
document.getElementById("yearSel").addEventListener("change",e=>{S.year=+e.target.value;S.aper=null;render();});
